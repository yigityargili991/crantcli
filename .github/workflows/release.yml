name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Created as a draft so "latest" keeps resolving to the previous
          # release until every asset is uploaded; the publish job flips it.
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists for tag $REF_NAME"
          else
            gh release create "$REF_NAME" --title "$REF_NAME" --generate-notes --draft
          fi

  release:
    needs: ensure-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - id: build
        name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          artifact="crant_type_look-${GOOS}-${GOARCH}${ext}"
          go build -ldflags "-s -w -X crantcli/cmd.Version=${REF_NAME}" -o "$artifact" .
          go version -m "$artifact" | grep 'CGO_ENABLED=0'
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign artifact (keyless)
        run: cosign sign-blob --yes --bundle "${{ steps.build.outputs.artifact }}.sigstore.json" "${{ steps.build.outputs.artifact }}"

      - name: Install Cosign v3 for standardized bundle
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v3.1.2
          install-dir: ${{ runner.temp }}/cosign-v3

      - name: Create standardized bundle
        run: |
          "${RUNNER_TEMP}/cosign-v3/cosign" bundle create \
            --artifact "${{ steps.build.outputs.artifact }}" \
            --bundle "${{ steps.build.outputs.artifact }}.sigstore.json" \
            --out "${{ steps.build.outputs.artifact }}.bundle.json"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.build.outputs.artifact }}" \
            "${{ steps.build.outputs.artifact }}.sigstore.json" \
            "${{ steps.build.outputs.artifact }}.bundle.json" --clobber

  installers:
    needs: ensure-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign installers (keyless)
        run: |
          cosign sign-blob --yes --bundle install.sh.sigstore.json install.sh
          cosign sign-blob --yes --bundle install.ps1.sigstore.json install.ps1

      - name: Install Cosign v3 for standardized bundles
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v3.1.2
          install-dir: ${{ runner.temp }}/cosign-v3

      - name: Create standardized installer bundles
        run: |
          for installer in install.sh install.ps1; do
            "${RUNNER_TEMP}/cosign-v3/cosign" bundle create \
              --artifact "$installer" \
              --bundle "$installer.sigstore.json" \
              --out "$installer.bundle.json"
          done

      - name: Upload installers to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            install.sh install.sh.sigstore.json install.sh.bundle.json \
            install.ps1 install.ps1.sigstore.json install.ps1.bundle.json --clobber

  checksums:
    needs: [release, installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate and upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          gh release download "$REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'crant_type_look-*' --dir dist
          gh release download "$REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'install.sh' --dir dist
          gh release download "$REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'install.ps1' --dir dist
          cd dist
          cp ../LICENSE ../NOTICE ../THIRD_PARTY_NOTICES.md .
          sha256sum crant_type_look-* install.sh install.ps1 LICENSE NOTICE THIRD_PARTY_NOTICES.md > checksums.txt
          gh release upload "$REF_NAME" checksums.txt LICENSE NOTICE THIRD_PARTY_NOTICES.md --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          draft=$(gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          case "$draft" in
            false)
              echo "Release $REF_NAME is already published"
              exit 0
              ;;
            true) ;;
            *)
              echo "::error::could not read the draft state of $REF_NAME (got \"$draft\")"
              exit 1
              ;;
          esac

          # Re-running an older tag's workflow must not drag "Latest" backwards
          # onto the draft it left behind, so claim it only when this tag sorts
          # above the newest published release.
          published=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          latest=--latest
          if [ -n "$published" ] && [ "$(printf '%s\n%s\n' "$REF_NAME" "$published" | sort -V | tail -n 1)" != "$REF_NAME" ]; then
            echo "Publishing $REF_NAME without claiming Latest; $published is newer"
            latest=--latest=false
          fi
          gh release edit "$REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "$latest"
