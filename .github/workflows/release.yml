name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release already exists for tag ${{ github.ref_name }}"
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          fi

  release:
    needs: ensure-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - id: build
        name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          artifact="crant_type_look-${GOOS}-${GOARCH}${ext}"
          go build -ldflags "-s -w -X crantcli/cmd.Version=${REF_NAME}" -o "$artifact" .
          go version -m "$artifact" | grep 'CGO_ENABLED=0'
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifact (keyless)
        run: cosign sign-blob --yes --bundle "${{ steps.build.outputs.artifact }}.sigstore.json" "${{ steps.build.outputs.artifact }}"

      - name: Install Cosign v3 for standardized bundle
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
          install-dir: ${{ runner.temp }}/cosign-v3

      - name: Create standardized bundle
        run: |
          "${RUNNER_TEMP}/cosign-v3/cosign" bundle create \
            --artifact "${{ steps.build.outputs.artifact }}" \
            --bundle "${{ steps.build.outputs.artifact }}.sigstore.json" \
            --out "${{ steps.build.outputs.artifact }}.bundle.json"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.build.outputs.artifact }}" \
            "${{ steps.build.outputs.artifact }}.sigstore.json" \
            "${{ steps.build.outputs.artifact }}.bundle.json" --clobber

  installers:
    needs: ensure-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign installers (keyless)
        run: |
          cosign sign-blob --yes --bundle install.sh.sigstore.json install.sh
          cosign sign-blob --yes --bundle install.ps1.sigstore.json install.ps1

      - name: Install Cosign v3 for standardized bundles
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
          install-dir: ${{ runner.temp }}/cosign-v3

      - name: Create standardized installer bundles
        run: |
          for installer in install.sh install.ps1; do
            "${RUNNER_TEMP}/cosign-v3/cosign" bundle create \
              --artifact "$installer" \
              --bundle "$installer.sigstore.json" \
              --out "$installer.bundle.json"
          done

      - name: Upload installers to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            install.sh install.sh.sigstore.json install.sh.bundle.json \
            install.ps1 install.ps1.sigstore.json install.ps1.bundle.json --clobber

  checksums:
    needs: [release, installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate and upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          gh release download "$REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'crant_type_look-*' --dir dist
          gh release download "$REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'install.sh' --dir dist
          gh release download "$REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'install.ps1' --dir dist
          cd dist
          cp ../LICENSE ../NOTICE ../THIRD_PARTY_NOTICES.md .
          sha256sum crant_type_look-* install.sh install.ps1 LICENSE NOTICE THIRD_PARTY_NOTICES.md > checksums.txt
          gh release upload "$REF_NAME" checksums.txt LICENSE NOTICE THIRD_PARTY_NOTICES.md --repo "$GITHUB_REPOSITORY" --clobber
