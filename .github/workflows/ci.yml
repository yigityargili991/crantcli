name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Generate coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage.out
          use_oidc: true

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test ./...

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test with Windows PowerShell
        shell: powershell
        run: ./tests/install_windows.ps1

      - name: Test with PowerShell
        shell: pwsh
        run: ./tests/install_windows.ps1

      - name: Smoke test published release
        if: ${{ github.event.repository.private == false }}
        shell: pwsh
        env:
          CRANTCLI_INSTALL_DIR: ${{ runner.temp }}\crantcli-bin
          CRANTCLI_SKIP_CHECKSUM: "0"
        run: |
          Get-Content -Raw ./install.ps1 | Invoke-Expression

          $installed = Join-Path $env:CRANTCLI_INSTALL_DIR "crantcli.exe"
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
            throw "installer did not create $installed"
          }
          if (($env:Path -split ";") -notcontains $env:CRANTCLI_INSTALL_DIR) {
            throw "installer did not add its destination to the current PATH"
          }

          $version = & $installed --version
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "installed crantcli did not report its version"
          }
          Write-Host $version

  unix-installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test installer logic
        run: sh ./tests/install_unix.sh

      - name: Smoke test published release
        if: ${{ github.event.repository.private == false }}
        env:
          CRANTCLI_INSTALL_DIR: ${{ runner.temp }}/crantcli-bin
          CRANTCLI_SKIP_CHECKSUM: "0"
        run: |
          set -eu
          cat ./install.sh | sh

          installed="$CRANTCLI_INSTALL_DIR/crantcli"
          test -x "$installed"
          version=$("$installed" --version)
          test -n "$version"
          printf '%s\n' "$version"

  linux-distro-installers:
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bookworm-slim
          - ubuntu:24.04
          - archlinux:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test installer logic
        run: sh ./tests/install_unix.sh
